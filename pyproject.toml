[project]
name = "pfsconfig_redaction"
# NOTE: derived from the git tags by setuptools_scm, see [tool.setuptools_scm].
dynamic = ["version"]
description = "Redact information in pfsConfig (PFSF) files for raw data delivery to PIs."
authors = [{ name = "Masato Onodera", email = "monodera@naoj.org" }]
dependencies = [
  "astropy>=5.2",  # required by pfs-datamodel
  "numpy>=1.24.4",  # required by pfs-datamodel
  "pfs-datamodel @ git+https://github.com/Subaru-PFS/datamodel.git",
  "scipy>=1.9.3",  # required by pfs-datamodel
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }

[dependency-groups]
dev = [
  "ipython>=8.18.1",
  "pandas>=2.2.3",
  "pytest>=8.4.0",
  "ruff>=0.11.8",
]

[tool.setuptools.package-data]
# NOTE: without this the marker is left out of the built distribution, and type
# checkers go on treating the package as untyped.
pfsconfig_redaction = ["py.typed"]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The version comes from the git tags: a build at a tag gets that version, a build
# between tags gets a development version derived from the last tag, so no version
# number has to be edited by hand. Defaults are fine; the table must still be present
# for setuptools_scm to take over the version.

[tool.pytest.ini_options]
# Restrict collection to tests/ so ad-hoc scripts at the repository root are ignored.
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]

[tool.ruff]
line-length = 88
target-version = "py311"
